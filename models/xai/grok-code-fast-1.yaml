# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: xai
model: grok-code-fast-1
name: Grok Code Fast 1
description: >-
  xAI's first dedicated coding model, given away free through GitHub Copilot and
  Cursor for long enough to build real habits around it. It is the only id in the
  May 2026 wave that does not route to grok-4.3 - coding traffic goes to
  grok-build-0.1 instead.
shutdown_on: 2026-05-15
status: retired
replacements:
  - provider: xai
    model: grok-build-0.1
    recommended: true
    note: >-
      The context window shrinks from 256k on both sides, but grok-build-0.1 is
      a different model rather than a tuned reasoning effort, so agent prompts
      are worth re-testing rather than lifting straight across.
sources:
  - url: https://docs.x.ai/developers/migration/may-15-retirement
    title: Grok Model Retirement on May 15, 2026
    accessed: 2026-08-03
last_verified: 2026-08-03
