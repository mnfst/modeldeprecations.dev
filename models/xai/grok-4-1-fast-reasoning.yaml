# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: xai
model: grok-4-1-fast-reasoning
name: Grok 4.1 Fast Reasoning
description: >-
  A 2M-context reasoning model that was, for a few months, the cheapest way to
  put a long document in front of a frontier model. It retired on 15 May 2026,
  and the slug still resolves - requests are silently served by grok-4.3 at
  grok-4.3 prices, which is the trap in this whole retirement wave.
shutdown_on: 2026-05-15
status: retired
replacements:
  - provider: xai
    model: grok-4.3
    recommended: true
    note: >-
      xAI maps this id to grok-4.3 with reasoning effort "low". The slug keeps
      working, so nothing breaks - but you are billed $1.25/$2.50 per million
      instead of the old rate, and the context window drops from 2M to 1M.
sources:
  - url: https://docs.x.ai/developers/migration/may-15-retirement
    title: Grok Model Retirement on May 15, 2026
    accessed: 2026-08-03
last_verified: 2026-08-03
