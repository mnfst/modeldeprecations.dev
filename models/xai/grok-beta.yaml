provider: xai
model: grok-beta
name: Grok Beta
description: >-
  The id xAI's public API launched with in November 2024, during the period when
  the whole platform was free credit and a waitlist. It lasted about a month
  before grok-2-1212 superseded it. Nothing in xAI's current documentation
  records when it stopped answering.
status: retired
