# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: xai
model: grok-4-1-fast-non-reasoning
name: Grok 4.1 Fast Non-Reasoning
description: >-
  The straight-through twin of Grok 4.1 Fast Reasoning, same weights and same 2M
  window with thinking turned off. Splitting one model into two ids by reasoning
  mode is exactly what grok-4.3's reasoning_effort parameter made unnecessary,
  and both halves went at once.
shutdown_on: 2026-05-15
status: retired
replacements:
  - provider: xai
    model: grok-4.3
    recommended: true
    note: >-
      Maps to grok-4.3 with reasoning effort "none". Set that explicitly rather
      than relying on the redirect, or a later change to the default leaves you
      paying for thinking tokens you never asked for.
sources:
  - url: https://docs.x.ai/developers/migration/may-15-retirement
    title: Grok Model Retirement on May 15, 2026
    accessed: 2026-08-03
last_verified: 2026-08-03
