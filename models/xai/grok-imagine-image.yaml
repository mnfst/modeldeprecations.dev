provider: xai
model: grok-imagine-image
name: Grok Imagine Image
description: >-
  xAI's image generation endpoint and the successor to the grok-2-image line. The
  Imagine family renamed everything: nothing in xAI's current image or video
  range carries a Grok version number any more, which makes the lineage from the
  1212-era models harder to trace than it should be.
