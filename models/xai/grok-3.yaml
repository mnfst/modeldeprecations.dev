# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: xai
model: grok-3
name: Grok 3
description: >-
  The model xAI trained on the Colossus cluster and launched in February 2025
  with a Super Bowl-scale marketing push, reaching the API that April. It is the
  oldest id in the May 2026 retirement wave and the only one whose replacement
  route runs through a non-reasoning setting, since Grok 3 never thought by
  default.
shutdown_on: 2026-05-15
status: retired
replacements:
  - provider: xai
    model: grok-4.3
    recommended: true
    note: >-
      Maps to grok-4.3 with reasoning effort "none".
sources:
  - url: https://docs.x.ai/developers/migration/may-15-retirement
    title: Grok Model Retirement on May 15, 2026
    accessed: 2026-08-03
last_verified: 2026-08-03
