# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: xai
model: grok-imagine-image-pro
name: Grok Imagine Image Pro
description: >-
  The premium tier of xAI's image generator, retired in the same wave as seven
  text models and renamed rather than replaced. Nothing about the model changed
  on 15 May 2026; the word "pro" was simply swapped for "quality" in the id.
shutdown_on: 2026-05-15
status: retired
replacements:
  - provider: xai
    model: grok-imagine-image-quality
    recommended: true
    note: >-
      A rename. Unlike the text models in this wave there is no price or context
      change to plan around - just the new string.
sources:
  - url: https://docs.x.ai/developers/migration/may-15-retirement
    title: Grok Model Retirement on May 15, 2026
    accessed: 2026-08-03
last_verified: 2026-08-03
