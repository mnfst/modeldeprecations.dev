provider: cohere
model: tiny-aya-earth
name: Tiny Aya Earth
description: >-
  The Tiny Aya variant tuned for West Asian and African languages. Splitting a 3B
  model four ways by region is the opposite of the usual approach of one large
  multilingual model, and it is aimed at exactly the languages that a global model
  under-serves.
