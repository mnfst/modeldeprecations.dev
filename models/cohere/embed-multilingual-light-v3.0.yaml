provider: cohere
model: embed-multilingual-light-v3.0
name: Embed Multilingual Light v3
description: >-
  The compact multilingual embedder, 512 tokens in and a smaller vector out. Like
  the English light model it survived the v2.0 cull, and it has no successor in the
  v4 generation - if you need small vectors across languages, this id is the whole
  option set.
