provider: cohere
model: embed-english-v3.0
name: Embed English v3
description: >-
  The English-only v3 embedder, and the model Cohere named when it retired
  embed-english-v2.0 in April 2026. It is still supported but no longer the
  default recommendation: new work is pointed at embed-v4.0, which handles images
  and much longer inputs.
