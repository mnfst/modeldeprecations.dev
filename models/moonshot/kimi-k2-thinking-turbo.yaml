# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: moonshot
model: kimi-k2-thinking-turbo
name: Kimi K2 Thinking Turbo
description: >-
  The fast-serving variant of K2 Thinking, and the fourth K2 id to express a
  combination of one model, one mode and one speed tier. Five ids for one model
  family is what the K2.6 consolidation was reacting to. Discontinued 25 May
  2026.
shutdown_on: 2026-05-25
status: retired
replacements:
  - provider: moonshot
    model: kimi-k2.6
    recommended: true
sources:
  - url: https://platform.kimi.ai/docs/models
    title: Kimi model list
    accessed: 2026-08-03
last_verified: 2026-08-03
