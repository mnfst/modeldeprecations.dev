model: kimi-k2.6
name: Kimi K2.6
description: >-
  A 256k multimodal model taking text, image and video input, with thinking as a
  request-level mode rather than a separate id - the change that made
  kimi-k2-thinking and its turbo variant redundant. It is the general-purpose
  model in the current range, sitting below K3 and beside the code-specific
  K2.7s.
