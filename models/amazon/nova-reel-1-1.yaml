# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: amazon
model: nova-reel-1-1
name: Amazon Nova Reel v1.1
description: >-
  The second Reel, and the id AWS's Nova documentation still lists as the current
  video model even though Bedrock's lifecycle table has it Legacy with a 30
  September 2026 end of life. When a provider's own two pages disagree, the
  lifecycle table is the one with the date on it.
  The Bedrock invoke id is amazon.nova-reel-v1:1.
deprecated_on: 2026-03-30
shutdown_on: 2026-09-30
status: deprecated
replacements:
  - provider: minimax
    model: MiniMax-H3
    recommended: false
    note: >-
      Amazon names no successor and Nova 2 ships no video generation model.
      MiniMax H3 is the nearest live video model in this catalogue; it is our
      suggestion, not Amazon's.
sources:
  - url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-lifecycle.html
    title: Amazon Bedrock model lifecycle
    accessed: 2026-08-03
  - url: https://docs.aws.amazon.com/nova/latest/userguide/what-is-nova.html
    title: What is Amazon Nova
    accessed: 2026-08-03
last_verified: 2026-08-03
