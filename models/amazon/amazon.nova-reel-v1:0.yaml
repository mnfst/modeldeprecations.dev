# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: amazon
model: amazon.nova-reel-v1:0
name: Amazon Nova Reel v1.0
description: >-
  The first release of Amazon's video generation model, producing 720p at 24
  frames a second from a 512-character prompt. Both Reel versions were moved to
  Legacy on the same day and share a 30 September 2026 end of life, so there is no
  newer Reel to migrate to.
deprecated_on: 2026-03-30
shutdown_on: 2026-09-30
status: deprecated
replacements:
  - provider: minimax
    model: MiniMax-H3
    recommended: false
    note: >-
      Amazon names no successor and Nova 2 ships no video generation model.
      MiniMax H3 is the nearest live video model in this catalogue; it is our
      suggestion, not Amazon's.
sources:
  - url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-lifecycle.html
    title: Amazon Bedrock model lifecycle
    accessed: 2026-08-03
last_verified: 2026-08-03
