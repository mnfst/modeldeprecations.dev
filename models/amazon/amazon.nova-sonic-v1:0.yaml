# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: amazon
model: amazon.nova-sonic-v1:0
name: Amazon Nova Sonic
description: >-
  Amazon's speech-to-speech model, taking audio in and returning audio plus a
  transcript over a bidirectional stream, in five languages. Legacy since 13 March
  2026 with an end of life on 14 September, and Bedrock's table names no
  replacement - there is currently no other Amazon-trained speech model on
  Bedrock.
deprecated_on: 2026-03-13
shutdown_on: 2026-09-14
status: deprecated
replacements:
  - provider: openai
    model: gpt-realtime-2.1
    recommended: false
    note: >-
      Bedrock's lifecycle table names no successor and Nova 2 Sonic is documented
      by name only, with no Bedrock model id published in the pages cited here.
      OpenAI's realtime model is the nearest live speech-to-speech equivalent
      this catalogue can point at; it is our suggestion, not Amazon's.
sources:
  - url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-lifecycle.html
    title: Amazon Bedrock model lifecycle
    accessed: 2026-08-03
  - url: https://docs.aws.amazon.com/nova/latest/userguide/what-is-nova.html
    title: What is Amazon Nova
    accessed: 2026-08-03
last_verified: 2026-08-03
