# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: anthropic
model: claude-mythos-preview
name: Claude Mythos Preview
description: >-
  The first Mythos-class model, released in April 2026 to a closed group of cyber
  defenders and critical infrastructure providers under Project Glasswing.
  Anthropic deprecated it on June 9, 2026, the day Mythos 5 shipped, and it is
  the only deprecated Claude model whose retirement date is still "to be
  announced" - an invitation-only model has no public user base to give sixty
  days' notice to.
deprecated_on: 2026-06-09
status: deprecated
replacements:
  - provider: anthropic
    model: claude-mythos-5
    recommended: true
    note: >-
      Same access model: invitation-only through Project Glasswing, no self-serve
      sign-up. Mythos 5 is priced at less than half of Mythos Preview.
sources:
  - url: https://platform.claude.com/docs/en/about-claude/model-deprecations
    title: Anthropic model deprecations
    accessed: 2026-10-16
  - url: https://platform.claude.com/docs/en/about-claude/models/overview
    title: Anthropic models overview
    accessed: 2026-10-16
last_verified: 2026-10-16
