# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: anthropic
model: claude-sonnet-4-5-20250929
name: Claude Sonnet 4.5
aliases: [claude-sonnet-4-5]
description: >-
  The September 2025 Sonnet, and the last one to use explicit extended thinking
  rather than the adaptive thinking introduced in 4.6. Anthropic announced its
  retirement on September 30, 2026, a day after its "not sooner than" date, and
  gave the usual sixty days' notice before requests start failing.
released_on: 2025-09-29
deprecated_on: 2026-09-30
shutdown_on: 2026-11-30
status: deprecated
replacements:
  - provider: anthropic
    model: claude-sonnet-5-5
    recommended: true
    note: >-
      Sonnet 5.5 does not accept the thinking.type "enabled" plus budget_tokens
      mode Sonnet 4.5 used; switch to adaptive thinking and steer it with effort.
      It also rejects non-default temperature, top_p and top_k with a 400, so
      drop those from the request.
sources:
  - url: https://platform.claude.com/docs/en/about-claude/model-deprecations
    title: Anthropic model deprecations
    accessed: 2026-10-16
  - url: https://platform.claude.com/docs/en/about-claude/models/overview
    title: Anthropic models overview
    accessed: 2026-10-16
last_verified: 2026-10-16
