# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: anthropic
model: claude-instant-1.2
name: Claude Instant 1.2
description: >-
  The last of the Instant line — Anthropic's cheap, fast tier before Haiku
  existed. It was retired in November 2024 with two months notice, and the Haiku
  models inherited its role.
released_on: 2023-08-09
deprecated_on: 2024-09-04
shutdown_on: 2024-11-06
status: retired
replacements:
  - provider: anthropic
    model: claude-haiku-4-5-20251001
    recommended: true
    note: >-
      Haiku 4.5 is the modern equivalent of this tier. Like Claude 2, Instant
      predates the Messages API, so the request format changes too.
sources:
  - url: https://platform.claude.com/docs/en/about-claude/model-deprecations
    title: Anthropic model deprecations
    accessed: 2026-07-30
last_verified: 2026-07-30
