provider: anthropic
model: claude-sonnet-4-20250514
name: Claude Sonnet 4
description: >-
  The workhorse of the Claude 4 generation, and for a year the default in Claude
  Code. Retired June 15, 2026 in the same announcement as Opus 4.
released_on: 2025-05-14
deprecated_on: 2026-04-14
shutdown_on: 2026-06-15
status: retired
replacements:
  - provider: anthropic
    model: claude-sonnet-4-6
