# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: anthropic
model: claude-3-7-sonnet-20250219
name: Claude Sonnet 3.7
aliases: [claude-3-7-sonnet-latest]
description: >-
  The first Claude with extended thinking, and the release that made a visible
  reasoning budget a mainstream API feature. It was retired in February 2026,
  almost exactly a year after launch.
released_on: 2025-02-19
deprecated_on: 2025-10-28
shutdown_on: 2026-02-19
status: retired
replacements:
  - provider: anthropic
    model: claude-sonnet-5-5
    recommended: true
    note: >-
      Sonnet 5.5 uses adaptive thinking steered by effort and does not accept the
      thinking.budget_tokens mode Sonnet 3.7 introduced.
sources:
