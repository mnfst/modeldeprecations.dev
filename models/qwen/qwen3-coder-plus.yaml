provider: qwen
model: qwen3-coder-plus
name: Qwen3 Coder Plus
description: >-
  Alibaba's dedicated coding model, popular well outside China because the open
  Qwen3-Coder weights made it easy to try before paying for the hosted id. Its
  retirement folds coding back into the general Plus tier, the same consolidation
  Mistral and Moonshot made in the same period.
