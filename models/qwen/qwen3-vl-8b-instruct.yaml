# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: qwen
model: qwen3-vl-8b-instruct
name: Qwen3 VL 8B Instruct
description: >-
  The small instruction-tuned vision model, 8B and open-weighted, which made it the
  usual choice for self-hosted image understanding in the Qwen ecosystem. The
  hosted id goes on 10 October 2026; the weights do not.
