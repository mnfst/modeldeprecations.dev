provider: qwen
model: qwen3-max-2026-01-23
name: Qwen3 Max (2026-01-23)
description: >-
  The January 2026 Max snapshot, five months old at the point Alibaba scheduled it
  for decommissioning. Dated Qwen snapshots get thirty days' notice against three
  months for stable ids, which is the argument for never pinning one unless you are
  reproducing an evaluation.
