# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: qwen
model: gte-rerank
name: GTE Rerank
description: >-
  The reranker Alibaba inherited from its GTE embedding research line, and the last
  Model Studio id that was not Qwen-branded. It was retired on 30 May 2026, which
  completed the rebranding of every retrieval model on the platform.
shutdown_on: 2026-05-30
status: retired
replacements:
  - provider: qwen
    model: qwen3-rerank
    recommended: true
sources:
  - url: https://www.alibabacloud.com/help/en/model-studio/model-depreciation
    title: Alibaba Cloud Model Studio model decommissioning
    accessed: 2026-08-03
last_verified: 2026-08-03
