# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: openai
model: gpt-4-0125-preview
name: GPT-4 Turbo preview (0125)
description: >-
  The January 2024 preview snapshot, released to fix a "laziness" regression
  where the model truncated long code generations. Retired in March 2026.
released_on: 2024-01-25
deprecated_on: 2025-09-26
shutdown_on: 2026-03-26
status: retired
replacements:
  - provider: openai
    model: gpt-5
    recommended: true
    note: >-
      The successor OpenAI named when this snapshot was retired.
      gpt-5 is itself deprecated and shuts down on December 11, 2026,
      with gpt-5.6-sol as its named successor, so a migration made now should
      go straight on to gpt-5.6-sol.
  - provider: openai
    model: gpt-4.1
    note: >-
      OpenAI's alternative for latency-sensitive work that does not need
      reasoning.
sources:
  - url: https://developers.openai.com/api/docs/deprecations
    title: OpenAI API deprecations
    accessed: 2026-10-16
last_verified: 2026-10-16
