# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: openai
model: gpt-4o-2024-05-13
name: GPT-4o (2024-05-13)
description: >-
  The original GPT-4o snapshot, the one that shipped at the May 2024 launch. It
  was deprecated in April 2026, six months ahead of the rest of GPT-4o: OpenAI
  deprecated the floating gpt-4o id and its later snapshots on October 14,
  2026, for removal on January 14, 2027.
released_on: 2024-05-13
deprecated_on: 2026-04-22
shutdown_on: 2026-10-23
status: deprecated
replacements:
  - provider: openai
    model: gpt-5.6-sol
    recommended: true
    note: >-
      Moving to the floating gpt-4o id buys under three months: OpenAI removes
      it on January 14, 2027.
sources:
  - url: https://developers.openai.com/api/docs/deprecations
    title: OpenAI API deprecations
    accessed: 2026-10-16
last_verified: 2026-10-16
