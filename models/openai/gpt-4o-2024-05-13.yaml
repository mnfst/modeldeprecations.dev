# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: openai
model: gpt-4o-2024-05-13
name: GPT-4o (2024-05-13)
description: >-
  The original GPT-4o snapshot, the one that shipped at the May 2024 launch, and
  the first to go: it shuts down in October 2026, three months before the later
  snapshots and the floating gpt-4o pointer. If you pinned the date, this is
  your deadline; if you did not, yours is January 14, 2027.
released_on: 2024-05-13
deprecated_on: 2026-04-22
shutdown_on: 2026-10-23
status: deprecated
replacements:
  - provider: openai
    model: gpt-5.6-sol
    recommended: true
    note: >-
      Do not move to the floating gpt-4o id: it shuts down on January 14, 2027,
      with every other GPT-4o snapshot.
sources:
  - url: https://developers.openai.com/api/docs/deprecations
    title: OpenAI API deprecations
    accessed: 2026-10-19
last_verified: 2026-10-19
