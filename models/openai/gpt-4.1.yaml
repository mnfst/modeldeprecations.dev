provider: openai
model: gpt-4.1
name: GPT-4.1
description: >-
  The 2025 refresh that fixed what GPT-4o was weakest at — instruction following
  and long-context recall — and became the default non-reasoning model for a
  year. Its dated snapshot gpt-4.1-2025-04-14 shuts down on January 14, 2027;
  OpenAI's notice does not list the bare gpt-4.1 id.
released_on: 2025-04-14
status: active
