# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: openai
model: gpt-4.1
name: GPT-4.1
description: >-
  The 2025 refresh that fixed what GPT-4o was weakest at — instruction following
  and long-context recall — and became the default non-reasoning model for a
  year. OpenAI's October 2026 notice names GPT-4.1 with its only dated snapshot,
  gpt-4.1-2025-04-14, so the bare gpt-4.1 id has nothing left to point at and
  stops answering with it on January 14, 2027.
released_on: 2025-04-14
deprecated_on: 2026-10-14
shutdown_on: 2027-01-14
status: deprecated
replacements:
  - provider: openai
    model: gpt-6-luna
    recommended: true
    note: >-
      OpenAI names GPT-6 Luna for every GPT-4.1 and GPT-4o snapshot in this
      wave. It is a reasoning model: on Chat Completions, function calling works
      only with reasoning_effort set to none. Luna cannot be fine-tuned, and a
      fine-tune of GPT-4.1 shuts down on the same day as its base.
sources:
  - url: https://developers.openai.com/api/docs/deprecations
    title: OpenAI API deprecations
    accessed: 2026-10-19
last_verified: 2026-10-19
