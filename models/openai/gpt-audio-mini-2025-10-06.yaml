# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: openai
model: gpt-audio-mini-2025-10-06
name: GPT Audio mini (2025-10-06)
description: >-
  The pinned October 2025 snapshot behind gpt-audio-mini, retired in July 2026
  while the floating id it backed stayed alive until 2027. The dated snapshot
  going first is the opposite of what most people assume pinning buys them.
released_on: 2025-10-06
deprecated_on: 2026-04-22
shutdown_on: 2026-07-23
status: retired
replacements:
  - provider: openai
    model: gpt-audio-1.5
    recommended: true
    note: >-
      Go straight to gpt-audio-1.5 rather than to the floating gpt-audio-mini,
      which shuts down in January 2027.
sources:
  - url: https://developers.openai.com/api/docs/deprecations
    title: OpenAI API deprecations
    accessed: 2026-07-30
last_verified: 2026-07-30
