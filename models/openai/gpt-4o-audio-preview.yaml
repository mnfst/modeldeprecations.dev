# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: openai
model: gpt-4o-audio-preview
name: GPT-4o Audio preview
description: >-
  Audio in and audio out over ordinary Chat Completions, without the WebSocket
  session the realtime models require. It suited anything that did not need to
  be interrupted mid-sentence — voice notes, summaries, asynchronous replies.
deprecated_on: 2025-09-15
shutdown_on: 2026-05-07
status: retired
replacements:
  - provider: openai
    model: gpt-audio-1.5
    recommended: true
    note: >-
      Same request/response shape, so this is closer to a drop-in than the
      realtime migration. Re-check the supported input and output audio formats.
sources:
  - url: https://developers.openai.com/api/docs/deprecations
    title: OpenAI API deprecations
    accessed: 2026-07-30
last_verified: 2026-07-30
