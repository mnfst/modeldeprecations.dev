provider: openai
model: omni-moderation
name: omni-moderation
description: >-
  The multimodal moderation endpoint that replaced the text-moderation family in
  October 2025. It scores images as well as text, and it is free — which is why
  the older text-only ids had no reason to survive.
status: active
