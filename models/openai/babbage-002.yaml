# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: openai
model: babbage-002
name: babbage-002
description: >-
  A base completions model kept in service almost entirely as a fine-tuning
  target for classification work, where a small model trained on your own labels
  still beat prompting a large one. Its shutdown on September 28, 2026 ended that
  option.
released_on: 2023-08-22
deprecated_on: 2025-09-26
shutdown_on: 2026-09-28
status: retired
replacements:
  - provider: openai
    model: gpt-5.6-terra
    recommended: true
    api_change: >-
      gpt-5.6-terra is not served on /v1/completions. Move the call to Chat
      Completions (/v1/chat/completions) or the Responses API (/v1/responses):
      the prompt string becomes messages or input.
    note: >-
      Existing fine-tunes do not transfer, and gpt-5.6-terra cannot be
      fine-tuned: a classifier trained on babbage-002 has to become a prompted
      one, and its accuracy re-validated against your labels.
sources:
  - url: https://developers.openai.com/api/docs/deprecations
    title: OpenAI API deprecations
    accessed: 2026-10-19
last_verified: 2026-10-19
