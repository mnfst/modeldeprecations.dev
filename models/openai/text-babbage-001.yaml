# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: openai
model: text-babbage-001
name: text-babbage-001
description: >-
  The second rung of the InstructGPT ladder, a step up from ada for
  classification work that needed slightly more nuance. Retired in January 2024
  when OpenAI collapsed four base sizes into two.
deprecated_on: 2023-07-06
shutdown_on: 2024-01-04
status: retired
replacements:
  - provider: openai
    model: gpt-3.5-turbo-instruct
    recommended: true
    note: >-
      The named successor kept the completions endpoint alive, but it is
      deprecated too, shutting down September 28, 2026. After that no
      completions-style model remains on the platform.
sources:
  - url: https://developers.openai.com/api/docs/deprecations
    title: OpenAI API deprecations
    accessed: 2026-07-30
last_verified: 2026-07-30
