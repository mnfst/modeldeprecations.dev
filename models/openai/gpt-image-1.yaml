# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: openai
model: gpt-image-1
name: GPT Image 1
description: >-
  The first image model of the GPT era, and the one that made image editing with
  a reference picture routine. It replaced the DALL·E line and was itself
  deprecated less than a year later, in the same April 2026 announcement that
  took out the o-series.
deprecated_on: 2026-04-22
shutdown_on: 2026-10-23
status: deprecated
replacements:
  - provider: openai
    model: gpt-image-2
    recommended: true
    note: >-
      A same-family upgrade, so the request shape carries over. Check output
      pricing per image size before rolling out — the tiers changed.
sources:
  - url: https://developers.openai.com/api/docs/deprecations
    title: OpenAI API deprecations
    accessed: 2026-07-30
last_verified: 2026-07-30
