# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: openai
model: gpt-4o-mini-audio-preview
name: GPT-4o mini Audio preview
description: >-
  The cost tier for audio on Chat Completions, aimed at transcription-adjacent
  work at volume. Retired in May 2026 with the rest of the gpt-4o audio family.
deprecated_on: 2025-09-15
shutdown_on: 2026-05-07
status: retired
replacements:
  - provider: openai
    model: gpt-audio-mini
    recommended: true
    note: >-
      gpt-audio-mini is deprecated in turn, shutting down January 2027. If you
      are migrating now, gpt-audio-1.5 avoids doing this twice.
sources:
  - url: https://developers.openai.com/api/docs/deprecations
    title: OpenAI API deprecations
    accessed: 2026-07-30
last_verified: 2026-07-30
