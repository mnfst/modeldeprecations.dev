# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: openai
model: o1
name: o1
aliases: [o1-2024-12-17]
description: >-
  The first generally available reasoning model, and the release that proved
  spending inference compute could substitute for a larger model. It introduced
  the constraints the whole o-series inherited: no system messages at launch, no
  streaming, and max_completion_tokens in place of max_tokens.
released_on: 2024-12-17
deprecated_on: 2026-04-22
shutdown_on: 2026-10-23
status: deprecated
replacements:
  - provider: openai
    model: gpt-5.6-sol
    recommended: true
    note: >-
      Sol lifts most of o1's restrictions — system messages, streaming and tool
      calls all work — so code written defensively around o1 can usually be
      simplified rather than ported.
sources:
  - url: https://developers.openai.com/api/docs/deprecations
    title: OpenAI API deprecations
    accessed: 2026-07-30
last_verified: 2026-07-30
