# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: openai
model: gpt-4o-mini
name: GPT-4o mini
aliases: [gpt-4o-mini-2024-07-18]
description: >-
  The model that made GPT-4-class quality cheap enough to put in a loop, and for
  a long stretch the highest-volume id on the OpenAI platform. OpenAI deprecated
  it on October 14, 2026, its one snapshot (2024-07-18) with it, and removes it
  from the API on January 14, 2027.
released_on: 2024-07-18
deprecated_on: 2026-10-14
shutdown_on: 2027-01-14
status: deprecated
replacements:
  - provider: openai
    model: gpt-6-luna
    recommended: true
    note: >-
      Fine-tuned versions follow the same shutdown schedule as the base model,
      so a fine-tune has to be re-run on the new base before January 14, 2027.
sources:
  - url: https://developers.openai.com/api/docs/deprecations
    title: OpenAI API deprecations
    accessed: 2026-10-16
last_verified: 2026-10-16
