provider: openai
model: gpt-4o-mini
name: GPT-4o mini
description: >-
  The model that made GPT-4-class quality cheap enough to put in a loop, and for
  a long stretch the highest-volume id on the OpenAI platform. Its only dated
  snapshot, gpt-4o-mini-2024-07-18, shuts down on January 14, 2027, but
  OpenAI's notice does not list the floating gpt-4o-mini pointer itself.
