# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: openai
model: gpt-5-nano
name: GPT-5 nano
aliases: [gpt-5-nano-2025-08-07]
description: >-
  The smallest model of the GPT-5 generation, priced for classification and
  routing work that runs millions of times a day. Deprecated alongside gpt-5 and
  gpt-5-mini in June 2026.
released_on: 2025-08-07
deprecated_on: 2026-06-11
shutdown_on: 2026-12-11
status: deprecated
replacements:
  - provider: openai
    model: gpt-5.6-luna
    recommended: true
    note: >-
      Luna occupies the same slot. At nano volumes even a small change in output
      length moves the bill, so re-measure token counts on real traffic rather
      than trusting the per-token price alone.
sources:
  - url: https://developers.openai.com/api/docs/deprecations
    title: OpenAI API deprecations
    accessed: 2026-07-30
last_verified: 2026-07-30
