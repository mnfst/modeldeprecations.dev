# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: openai
model: gpt-5.2-chat-latest
name: GPT-5.2 chat-latest
description: >-
  One of the non-reasoning chat pointers that mirrored the model behind ChatGPT
  at a given moment. These ids exist for conversational parity, not for tool use,
  and OpenAI retires them faster than the numbered API models — this one got a
  three-month notice, not six.
deprecated_on: 2026-05-08
shutdown_on: 2026-08-10
status: deprecated
replacements:
  - provider: openai
    model: gpt-5.6-sol
    recommended: true
    note: >-
      The chat-latest pointers do not support the full tool-calling surface, so
      moving to Sol is usually an upgrade rather than a like-for-like swap. Check
      any prompt that was tuned against ChatGPT-flavoured output.
sources:
  - url: https://developers.openai.com/api/docs/deprecations
    title: OpenAI API deprecations
    accessed: 2026-07-30
last_verified: 2026-07-30
