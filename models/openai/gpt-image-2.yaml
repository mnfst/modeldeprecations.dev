# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: openai
model: gpt-image-2
name: GPT Image 2
description: >-
  The image model OpenAI names as the replacement for DALL·E 2 and 3. The
  gpt-image-1 family that came between them was deprecated in 2026 and points
  past it, to the GPT Image 2.5 pair, so the whole image line turned over inside
  eighteen months.
status: active
sources:
  - url: https://developers.openai.com/api/docs/deprecations
    title: OpenAI API deprecations
    accessed: 2026-10-16
last_verified: 2026-10-16
