# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: openai
model: dall-e-2
name: DALL·E 2
description: >-
  The model that put text-to-image generation in front of a general audience in
  2022, complete with the waitlist that made it feel like an event. By the time
  it was retired in May 2026 it had been outclassed for years — it survived on
  inertia and on the inpainting API that had no direct successor for a while.
released_on: 2022-04-06
deprecated_on: 2025-11-14
shutdown_on: 2026-05-12
status: retired
replacements:
  - provider: openai
    model: gpt-image-2
    recommended: true
    api_change: >-
      gpt-image-2 always returns base64 (data[].b64_json), never a URL:
      response_format is unsupported, so store or serve the decoded bytes
      yourself. There is no equivalent of the DALL·E 2 variations call
      (/v1/images/variations).
    note: >-
      Size takes 1024x1024, 1536x1024, 1024x1536, auto or a custom WIDTHxHEIGHT
      in multiples of 16 within the model's pixel limits; check any 256x256 or
      512x512 request against them.
sources:
  - url: https://developers.openai.com/api/docs/deprecations
    title: OpenAI API deprecations
    accessed: 2026-10-19
  - url: https://developers.openai.com/api/reference/resources/images/methods/generate
    title: OpenAI Images API reference
    accessed: 2026-10-19
last_verified: 2026-10-19
