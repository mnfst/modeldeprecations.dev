# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: openai
model: chatgpt-image-latest
name: ChatGPT Image latest
description: >-
  A floating pointer to whichever image model ChatGPT was using, for products
  that wanted to match what users saw in the app. Like every other -latest
  pointer OpenAI has shipped, it was retired on a shorter notice than the pinned
  ids it pointed at.
deprecated_on: 2026-06-02
shutdown_on: 2026-12-01
status: deprecated
replacements:
  - provider: openai
    model: gpt-image-2.5-sunburst
    recommended: true
    note: >-
      Move to a pinned id. OpenAI names Sunburst or Flare; each has a dated
      snapshot (-2026-09-08) to pin to.
  - provider: openai
    model: gpt-image-2.5-flare
    note: >-
      The other replacement OpenAI names: its fastest model for everyday image
      generation, at the same token rates as Sunburst.
sources:
  - url: https://developers.openai.com/api/docs/deprecations
    title: OpenAI API deprecations
    accessed: 2026-10-16
last_verified: 2026-10-16
