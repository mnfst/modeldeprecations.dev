# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: openai
model: gpt-4o-2024-08-06
name: GPT-4o (2024-08-06)
description: >-
  The August 2024 GPT-4o snapshot, the first to support Structured Outputs and
  for most of its life the one the floating gpt-4o id pointed at. OpenAI
  deprecated it on October 14, 2026 alongside the November snapshot, which
  leaves the floating gpt-4o id nothing to point at after January 14, 2027.
deprecated_on: 2026-10-14
shutdown_on: 2027-01-14
status: deprecated
replacements:
  - provider: openai
    model: gpt-6-luna
    recommended: true
    note: >-
      OpenAI names GPT-6 Luna for every snapshot in this wave. It is a
      reasoning model: on Chat Completions, function calling works only with
      reasoning_effort set to none. Luna cannot be fine-tuned, and a fine-tune
      of this snapshot shuts down on the same day as its base.
sources:
  - url: https://developers.openai.com/api/docs/deprecations
    title: OpenAI API deprecations
    accessed: 2026-10-19
last_verified: 2026-10-19
