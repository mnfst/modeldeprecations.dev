provider: openai
model: gpt-5.6-luna
name: GPT-5.6 Luna
description: >-
  The smallest and cheapest model of the GPT-5.6 generation, the slot GPT-4.1
  nano used to occupy. OpenAI names it as the replacement for gpt-4.1-nano, so
  it inherits the classification, extraction and routing workloads that never
  needed a frontier model in the first place.
status: active
sources:
