# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: openai
model: gpt-4-0314
name: GPT-4 (0314)
description: >-
  The launch snapshot of GPT-4, from March 2023. It was scheduled for removal
  twice — first for June 2024, then extended — before finally going in March
  2026, which made it one of the longest-lived pinned snapshots OpenAI ever
  shipped.
released_on: 2023-03-14
deprecated_on: 2025-09-26
shutdown_on: 2026-03-26
status: retired
replacements:
  - provider: openai
    model: gpt-5
    recommended: true
    note: >-
      The successor OpenAI named when this snapshot was retired.
      gpt-5 is itself deprecated and shuts down on December 11, 2026,
      with gpt-5.6-sol as its named successor, so a migration made now should
      go straight on to gpt-5.6-sol.
  - provider: openai
    model: gpt-4.1
    note: >-
      OpenAI's alternative for latency-sensitive work that does not need
      reasoning.
sources:
  - url: https://developers.openai.com/api/docs/deprecations
    title: OpenAI API deprecations
    accessed: 2026-10-16
last_verified: 2026-10-16
