# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: openai
model: gpt-image-1-mini
name: GPT Image 1 mini
description: >-
  The cost tier of the first GPT image generation, for thumbnails and drafts
  where a cheaper picture is the right answer. Deprecated in June 2026 with a
  December shutdown, two months after its larger sibling goes.
deprecated_on: 2026-06-02
shutdown_on: 2026-12-01
status: deprecated
replacements:
  - provider: openai
    model: gpt-image-2.5-sunburst
    recommended: true
    note: >-
      OpenAI names Sunburst or Flare; there is no mini id in the 2.5
      generation, so cost control moves to the quality setting. Flare, the
      faster of the two, is the closer fit for drafts and thumbnails.
  - provider: openai
    model: gpt-image-2.5-flare
    note: >-
      The other replacement OpenAI names: its fastest model for everyday image
      generation, at the same token rates as Sunburst.
sources:
  - url: https://developers.openai.com/api/docs/deprecations
    title: OpenAI API deprecations
    accessed: 2026-10-16
last_verified: 2026-10-16
