# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: openai
model: gpt-4
name: GPT-4
aliases: [gpt-4-0613]
description: >-
  The model that started the current era, and still the id people type when they
  mean "the good one". OpenAI kept it alive for three and a half years — far
  longer than anything released since — and set its shutdown for October 2026.
released_on: 2023-03-14
deprecated_on: 2026-04-22
shutdown_on: 2026-10-23
status: deprecated
replacements:
  - provider: openai
    model: gpt-5.6-sol
    recommended: true
    note: >-
      Sol is a reasoning model, so it is not a behavioural drop-in: swap
      max_tokens for max_completion_tokens and expect reasoning tokens on the
      bill. Prompts written to coax GPT-4 into thinking step by step are now
      counterproductive.
sources:
  - url: https://developers.openai.com/api/docs/deprecations
    title: OpenAI API deprecations
    accessed: 2026-07-30
last_verified: 2026-07-30
