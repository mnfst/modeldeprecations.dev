# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: openai
model: gpt-5-chat-latest
name: GPT-5 chat-latest
description: >-
  The first of the chat-latest pointers, tracking whatever non-reasoning model
  ChatGPT was serving. It was retired in July 2026 with three months notice,
  along with the entire first-generation Codex line.
deprecated_on: 2026-04-22
shutdown_on: 2026-07-23
status: retired
replacements:
  [
    {
      provider: openai,
      model: gpt-5.6-sol,
      recommended: true,
      note: "Sol is pinned rather than floating, so behaviour stops changing underneath you between deploys.",
    },
  ]
sources:
  - url: https://developers.openai.com/api/docs/deprecations
    title: OpenAI API deprecations
    accessed: 2026-07-30
last_verified: 2026-07-30
