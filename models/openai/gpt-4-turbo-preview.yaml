# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: openai
model: gpt-4-turbo-preview
name: GPT-4 Turbo preview
aliases: [gpt-4-turbo-preview-completions]
description: >-
  A floating pointer that resolved to whichever GPT-4 Turbo preview snapshot was
  current, which meant its behaviour changed underneath anyone who used it. It
  was retired in March 2026 along with the snapshots it pointed at.
deprecated_on: 2025-09-26
shutdown_on: 2026-03-26
status: retired
replacements:
  - provider: openai
    model: gpt-5
    recommended: true
    note: >-
      Prefer a pinned id this time. OpenAI names gpt-5 for this pointer.
      gpt-5 is itself deprecated and shuts down on December 11, 2026,
      with gpt-5.6-sol as its named successor, so a migration made now should
      go straight on to gpt-5.6-sol.
  - provider: openai
    model: gpt-4.1
    note: >-
      OpenAI's alternative for latency-sensitive work that does not need
      reasoning. gpt-4.1 itself shuts down on January 14, 2027, with
      gpt-6-luna as its named successor, so go straight to gpt-6-luna.
sources:
  - url: https://developers.openai.com/api/docs/deprecations
    title: OpenAI API deprecations
    accessed: 2026-10-19
last_verified: 2026-10-19
