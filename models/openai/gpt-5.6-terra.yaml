model: gpt-5.6-terra
name: GPT-5.6 Terra
description: >-
  The middle tier of the GPT-5.6 generation, aimed at high-volume work where
  latency and price matter more than the last few points of reasoning. It is the
  named replacement for o4-mini, the search-preview models and the long tail of
  GPT-3.5 ids, which makes it the busiest migration target on the OpenAI side of
  this catalog.
