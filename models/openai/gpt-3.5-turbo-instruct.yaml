# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: openai
model: gpt-3.5-turbo-instruct
name: GPT-3.5 Turbo Instruct
description: >-
  The last completions-endpoint model OpenAI shipped, kept alive years past the
  rest of the /v1/completions family because logprobs and raw continuation
  behaviour had no equivalent in chat. Its shutdown on September 28, 2026 closed
  out the completions era entirely.
released_on: 2023-09-18
deprecated_on: 2025-09-26
shutdown_on: 2026-09-28
status: retired
replacements:
  - provider: openai
    model: gpt-5.6-terra
    recommended: true
    api_change: >-
      gpt-5.6-terra is not served on /v1/completions. Move the call to Chat
      Completions (/v1/chat/completions) or the Responses API (/v1/responses):
      the prompt string becomes messages or input, and the text comes back in a
      message rather than choices[].text.
    note: >-
      Raw continuation behaviour has no direct equivalent on a chat model, and
      suffix (insertion) has none either.
sources:
  - url: https://developers.openai.com/api/docs/deprecations
    title: OpenAI API deprecations
    accessed: 2026-10-19
last_verified: 2026-10-19
