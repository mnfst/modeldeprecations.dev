provider: openai
model: gpt-5.5-pro
name: GPT-5.5 Pro
description: >-
  The extended-compute variant of GPT-5.5, which spends much longer per request
  in exchange for accuracy on problems where a wrong answer is expensive. Pro
  tiers have historically been deprecated on the same schedule as the base model
  they derive from, so its lifecycle is worth watching alongside GPT-5.5.
status: active
sources:
