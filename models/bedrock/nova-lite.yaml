name: Amazon Nova Lite
description: >-
  The cheap multimodal Nova, taking the same text, image and video inputs as Pro
  at a fraction of the price and the same 300k window. It is a distillation
  student of both Premier and Pro, which means the model AWS taught it with is
  now Legacy while the student is not.
  The Bedrock invoke id is amazon.nova-lite-v1:0.
