# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: bedrock
model: nova-premier
name: Amazon Nova Premier
description: >-
  The most capable model Amazon has trained itself, a million-token multimodal
  system sold as much for distilling smaller custom models as for serving traffic.
  It went Legacy on 13 March 2026 and ends on 14 September. Anyone who used it as
  a distillation teacher loses the teacher, not just the endpoint.
  The Bedrock invoke id is amazon.nova-premier-v1:0.
deprecated_on: 2026-03-13
shutdown_on: 2026-09-14
status: deprecated
replacements:
  - provider: bedrock
    model: nova-pro
    recommended: false
    note: >-
      Bedrock's lifecycle table names no successor. Nova Pro is the most capable
      Active first-generation Nova; AWS has since opened a separate Nova 2 user
      guide, but no Nova 2 model id appears in the v1 documentation cited here.
sources:
  - url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-lifecycle.html
    title: Amazon Bedrock model lifecycle
    accessed: 2026-08-03
  - url: https://docs.aws.amazon.com/nova/latest/userguide/what-is-nova.html
    title: What is Amazon Nova
    accessed: 2026-08-03
last_verified: 2026-08-03
