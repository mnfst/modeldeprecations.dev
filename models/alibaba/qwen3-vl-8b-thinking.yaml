# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: alibaba
model: qwen3-vl-8b-thinking
name: Qwen3 VL 8B Thinking
description: >-
  The reasoning variant of the 8B vision model, shipped as a separate id rather
  than a parameter. Splitting thinking and non-thinking into two model strings is
  the convention every major lab abandoned during 2026, and Alibaba retiring both
  halves on one day is the end of it here.
shutdown_on: 2026-10-10
status: deprecated
replacements:
  - provider: alibaba
    model: qwen3.6-flash
    recommended: true
sources:
  - url: https://www.alibabacloud.com/help/en/model-studio/model-depreciation
    title: Alibaba Cloud Model Studio model decommissioning
    accessed: 2026-08-03
last_verified: 2026-08-03
