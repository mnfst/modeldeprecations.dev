provider: mistral
model: mistral-small-2402
name: Mistral Small 1.0
description: >-
  The original Small, launched February 2024 next to Mistral Large as the cheap
  half of the pair, and internally a tuned Mixtral 8x7B rather than a dense model.
  It was deprecated the same November and given seven months, outliving several
  models that shipped after it.
deprecated_on: 2024-11-30
shutdown_on: 2025-06-16
status: retired
replacements:
