provider: mistral
model: ministral-3-3b-25-12
name: Ministral 3 3B
description: >-
  The smallest model Mistral serves over the API, and the successor to
  ministral-3b-2410. The 24.10 Ministrals were premier-licensed and lasted barely
  a year; the 25.12 rewrite is Apache 2.0 and shares its training run with the 8B
  and 14B, so the three now move as one family rather than as separately dated
  point releases.
status: active
