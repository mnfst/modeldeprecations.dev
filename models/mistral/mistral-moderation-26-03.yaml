provider: mistral
model: mistral-moderation-26-03
name: Mistral Moderation 2
description: >-
  The classifier behind Mistral's moderation endpoint, and the replacement for
  the 24.11 original that shut down on 30 June 2026. Moderation models are the
  ones people forget to migrate, because they usually sit in a middleware layer
  nobody has opened in a year - and a moderation call that starts erroring
  either fails open or blocks every request, depending on how you wrote it.
status: active
sources:
