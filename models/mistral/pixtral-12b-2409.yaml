# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: mistral
model: pixtral-12b-2409
name: Pixtral 12B
description: >-
  Mistral's first multimodal model, released Apache 2.0 in September 2024 and
  notable for handling images at native resolution rather than downsampling them
  to a fixed grid. Mistral points it at Ministral 3 14B, the only small model in
  the current range that takes images at all.
deprecated_on: 2025-12-02
shutdown_on: 2025-12-31
status: retired
replacements:
  - provider: mistral
    model: ministral-3-14b-25-12
    recommended: true
sources:
  - url: https://docs.mistral.ai/getting-started/models/models_overview/
    title: Mistral models overview
    accessed: 2026-08-03
last_verified: 2026-08-03
