provider: mistral
model: mistral-ocr-2503
name: Mistral OCR
description: >-
  The original Mistral OCR, launched in March 2025 and marketed as the best
  document-understanding API on the market at a thousand pages per dollar. It
  was gone by the end of that year. Its deprecation notice gave twenty-nine days,
  the shortest runway of any Mistral model with both dates published.
deprecated_on: 2025-12-02
