# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: mistral
model: magistral-medium-2509
name: Magistral Medium 1.2
description: >-
  The last Magistral Medium, and the one that added vision to Mistral's
  reasoning line. It survived ten months, longer than either 1.0 or 1.1, and
  died with the rest of the family when Mistral folded explicit reasoning into
  Medium 3.5 as a mode rather than a model.
deprecated_on: 2026-05-22
shutdown_on: 2026-07-31
status: retired
replacements:
  - provider: mistral
    model: mistral-medium-3-5-26-04
    recommended: true
    note: >-
      Magistral exposed its chain of thought in a dedicated block. Medium 3.5
      handles reasoning as a request-level setting, so the response shape is not
      the same and thinking-token accounting changes with it.
sources:
  - url: https://docs.mistral.ai/getting-started/models/models_overview/
    title: Mistral models overview
    accessed: 2026-08-03
last_verified: 2026-08-03
