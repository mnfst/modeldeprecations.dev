# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: mistral
model: mistral-large-2407
name: Mistral Large 2.0
description: >-
  The 123B model that made Mistral competitive with GPT-4 class systems in
  mid-2024, and the first Large released with downloadable weights under a
  research licence. It also holds the longest deprecation runway in the Mistral
  table: announced 30 November 2024, shut down 30 March 2025, four full months.
deprecated_on: 2024-11-30
shutdown_on: 2025-03-30
status: retired
replacements:
  - provider: mistral
    model: mistral-large-3-25-12
    recommended: true
sources:
  - url: https://docs.mistral.ai/getting-started/models/models_overview/
    title: Mistral models overview
    accessed: 2026-08-03
last_verified: 2026-08-03
