# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: mistral
model: magistral-small-2509
name: Magistral Small 1.2
description: >-
  The open-weights counterpart to Magistral Medium 1.2, Apache 2.0 and small
  enough to run on a single consumer GPU, which is why it showed up in a lot of
  local reasoning setups. Its API id retired on 31 July 2026 alongside the rest
  of the line, but the weights it shipped are still downloadable.
deprecated_on: 2026-04-30
shutdown_on: 2026-07-31
status: retired
replacements:
  - provider: mistral
    model: mistral-small-4-0-26-03
    recommended: true
sources:
  - url: https://docs.mistral.ai/getting-started/models/models_overview/
    title: Mistral models overview
    accessed: 2026-08-03
last_verified: 2026-08-03
