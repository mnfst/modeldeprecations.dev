# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: mistral
model: pixtral-large-2411
name: Pixtral Large
description: >-
  A 124B multimodal model built on Mistral Large 2.1 with a 1B vision encoder
  bolted on, and Mistral's answer to GPT-4o on charts and documents. It retired
  on the same day as the text model it was built from, and Mistral has not
  shipped a Pixtral since - vision is now a property of Medium 3.5 rather than a
  separate family.
deprecated_on: 2026-02-27
shutdown_on: 2026-05-31
status: retired
replacements:
  - provider: mistral
    model: mistral-medium-3-5-26-04
    recommended: true
sources:
  - url: https://docs.mistral.ai/getting-started/models/models_overview/
    title: Mistral models overview
    accessed: 2026-08-03
last_verified: 2026-08-03
