# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: mistral
model: magistral-small-2506
name: Magistral Small 1.0
description: >-
  The first open reasoning model Mistral published, distilled from Magistral
  Medium and released under Apache 2.0 on the same June 2025 day. Its API life
  was under five months. If you are trying to reproduce a June 2025 evaluation
  run, the id no longer resolves and you will need the Hugging Face weights.
deprecated_on: 2025-10-31
shutdown_on: 2025-11-30
status: retired
replacements:
  - provider: mistral
    model: mistral-small-4-0-26-03
    recommended: true
sources:
  - url: https://docs.mistral.ai/getting-started/models/models_overview/
    title: Mistral models overview
    accessed: 2026-08-03
last_verified: 2026-08-03
