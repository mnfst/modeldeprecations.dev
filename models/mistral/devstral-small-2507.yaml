provider: mistral
model: devstral-small-2507
name: Devstral Small 1.1
description: >-
  An Apache 2.0 coding model that punched well above its size on SWE-bench and
  got adopted fast by people running agents locally. The API id is retired, but
  because the weights were released openly this is one of the few entries in the
  catalogue where the model itself did not go anywhere - only Mistral's hosting
  of it did.
deprecated_on: 2026-02-27
