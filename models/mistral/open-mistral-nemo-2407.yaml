provider: mistral
model: open-mistral-nemo-2407
name: Mistral Nemo 12B
description: >-
  Built with NVIDIA, Apache 2.0, and the model that introduced the Tekken
  tokenizer Mistral still uses. It is the longest-lived open id in the
  catalogue - two years on the API, outlasting three full Mistral Small
  generations - and was only retired in the May 2026 wave.
aliases:
