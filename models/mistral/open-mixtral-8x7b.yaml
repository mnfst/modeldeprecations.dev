# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: mistral
model: open-mixtral-8x7b
name: Mixtral 8x7B
description: >-
  The first sparse mixture-of-experts anyone could download, dropped in December
  2023 with no announcement, and the model that made MoE a mainstream open-weights
  architecture rather than a lab curiosity. Its API id was retired in March 2025;
  its influence on everything Mistral ships now was not.
deprecated_on: 2024-11-30
shutdown_on: 2025-03-30
status: retired
replacements:
  - provider: mistral
    model: mistral-small-4-0-26-03
    recommended: true
sources:
  - url: https://docs.mistral.ai/getting-started/models/models_overview/
    title: Mistral models overview
    accessed: 2026-08-03
last_verified: 2026-08-03
