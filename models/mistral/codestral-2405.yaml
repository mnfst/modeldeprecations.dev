model: codestral-2405
name: Codestral 24.05
description: >-
  The first Codestral, a 22B fill-in-the-middle model covering eighty programming
  languages, released under a licence that banned commercial use and started a
  long argument about what Mistral meant by open. It ran on the API for thirteen
  months.
