# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: mistral
model: mistral-saba-2502
name: Mistral Saba
description: >-
  A 24B model trained for Arabic and South Indian languages, the only regional
  model Mistral has ever put on the API. It was deprecated four months after
  launch and Mistral pointed it at Mistral Small 4, a general model with no
  particular claim on Arabic - if Saba was doing something specific for you,
  there is no like-for-like successor.
deprecated_on: 2025-06-10
shutdown_on: 2025-09-30
status: retired
replacements:
  - provider: mistral
    model: mistral-small-4-0-26-03
    recommended: true
sources:
  - url: https://docs.mistral.ai/getting-started/models/models_overview/
    title: Mistral models overview
    accessed: 2026-08-03
last_verified: 2026-08-03
