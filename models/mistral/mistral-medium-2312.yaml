provider: mistral
model: mistral-medium-2312
name: Mistral Medium 1.0
description: >-
  The oldest id in Mistral's table, from December 2023, and a model the company
  never published anything about - no weights, no paper, no architecture. It
  leaked to the internet as "Miqu" in early 2024 and was widely believed to be a
  Llama 2 70B fine-tune, which Mistral's CEO more or less confirmed.
deprecated_on: 2024-11-30
shutdown_on: 2025-06-16
status: retired
replacements:
