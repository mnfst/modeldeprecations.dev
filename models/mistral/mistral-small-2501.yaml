provider: mistral
model: mistral-small-2501
name: Mistral Small 3.0
description: >-
  The 24B rewrite that reset the Small line in January 2025, dropping the layer
  count for latency and landing at roughly Llama 3.3 70B quality at a third of
  the size. It was the model that made "small" mean 24B rather than 22B at
  Mistral, and it lasted ten months.
deprecated_on: 2025-11-06
shutdown_on: 2025-11-30
status: retired
replacements:
