name: MiniMax M2.7 Highspeed
description: >-
  The throughput-optimised M2.7, sold as a distinct id rather than as a routing
  hint. MiniMax has shipped a highspeed twin for every model since M2.1, which
  doubles the size of the catalogue and means a latency decision is baked into
  the model string your code sends.
