name: Music 3.0
description: >-
  The July 2026 music generation model, fourth in a line that started as a beta in
  mid-2025 and has shipped roughly every three months since. Unlike the speech
  line, MiniMax lists only the current music model in its API overview, so the
  earlier ids are gone without ever having been formally retired.
