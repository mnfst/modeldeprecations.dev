provider: z-ai
model: glm-5.1
name: GLM-5.1
description: >-
  The April 2026 refresh of GLM-5, and the model people were pushed to when
  third-party hosts started dropping GLM-5. On Z.ai's own platform both are still
  listed and priced, which is the difference worth knowing: a model can be
  deprecated on someone else's inference service while the source provider keeps
  serving it.
