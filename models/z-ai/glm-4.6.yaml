provider: z-ai
model: glm-4.6
name: GLM-4.6
description: >-
  The model that took Z.ai's context window from 128k to 200k and became the
  default open-weights choice for coding agents through late 2025. It is named in
  the GLM-5.2 migration guide as a model to move off, but Z.ai has published no
  date for it and it is still on the pricing page.
released_on: 2025-09-30
