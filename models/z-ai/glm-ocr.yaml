provider: z-ai
model: glm-ocr
name: GLM-OCR
description: >-
  Z.ai's document-parsing model, split out from the general vision line in February
  2026. Keeping OCR separate from vision is the same call Mistral made and the
  opposite of Google's - the argument being that structured document extraction
  wants different training data than general image understanding.
released_on: 2026-02-03
