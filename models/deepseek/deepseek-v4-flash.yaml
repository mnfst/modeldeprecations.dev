# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: deepseek
model: deepseek-v4-flash
name: DeepSeek V4 Flash
description: >-
  The smaller half of DeepSeek V4 — 284B parameters with 13B active — and the
  landing place for every integration that used to call deepseek-chat or
  deepseek-reasoner. DeepSeek retired the model on September 10, 2026, when V4.1
  Flash shipped under the new deepseek-flash id; the old name still answers,
  but only because DeepSeek routes it to V4.1 Flash for now, with no end date
  given.
released_on: 2026-04-24
deprecated_on: 2026-09-10
status: deprecated
replacements:
  - provider: deepseek
    model: deepseek-flash
    recommended: true
    note: >-
      DeepSeek's instruction is to change the model name to deepseek-flash.
      Requests to deepseek-v4-flash are already served by V4.1 Flash and billed
      at the Flash price, so the switch changes no behaviour, only how long
      the id keeps working. Thinking stays on by default.
sources:
  - url: https://api-docs.deepseek.com/updates/
    title: DeepSeek API change log
    accessed: 2026-10-19
  - url: https://api-docs.deepseek.com/quick_start/pricing
    title: DeepSeek models and pricing
    accessed: 2026-10-19
  - url: https://api-docs.deepseek.com/news/news260424/
    title: DeepSeek V4 Preview Release
    accessed: 2026-08-03
last_verified: 2026-10-19
