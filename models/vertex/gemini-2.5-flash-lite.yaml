provider: vertex
model: gemini-2.5-flash-lite
name: Gemini 2.5 Flash-Lite (Vertex AI)
description: >-
  The lowest-cost member of the 2.5 generation on Vertex AI, used where latency
  and price beat capability. Google has committed to retiring it on the
  platform on October 20, 2026, with the 3.1 Flash-Lite line as the migration
  target.
released_on: 2025-07-22
shutdown_on: 2026-10-20
status: deprecated
