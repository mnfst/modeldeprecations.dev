# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: google
model: gemini-embedding-001
name: Gemini Embedding 001
description: >-
  The first Gemini-branded embedding model, and the holder of the longest runway
  in Google's entire deprecation table: released July 2025 with a shutdown no
  earlier than 14 May 2028, almost three years out. Google gives embedding models
  far more notice than chat models precisely because re-indexing is expensive.
released_on: 2025-07-14
earliest_shutdown_on: 2028-05-14
status: active
replacements:
  - provider: google
    model: gemini-embedding-2
    recommended: true
sources:
  - url: https://ai.google.dev/gemini-api/docs/deprecations
    title: Gemini API deprecations
    accessed: 2026-08-03
last_verified: 2026-08-03
