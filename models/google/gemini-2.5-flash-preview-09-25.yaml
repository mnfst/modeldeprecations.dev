provider: google
model: gemini-2.5-flash-preview-09-25
name: Gemini 2.5 Flash (preview 09-25)
description: >-
  The September 2025 preview snapshot of 2.5 Flash, released to test changes
  ahead of the stable model. Shut down February 2026.
released_on: 2025-09-25
shutdown_on: 2026-02-17
status: retired
replacements:
