# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: google
model: gemini-2.0-flash-lite-preview
name: Gemini 2.0 Flash-Lite (preview)
aliases: [gemini-2.0-flash-lite-preview-02-05]
description: >-
  The preview of the 2.0 Lite tier, published on the same day as the 2.0 Flash
  launch. It outlived its own stable successor's preview cycle and was shut down
  in December 2025.
released_on: 2025-02-05
shutdown_on: 2025-12-09
status: retired
replacements:
  - provider: google
    model: gemini-2.5-flash-lite
    recommended: true
    note: >-
      Google names 2.5 Flash-Lite here, but now serves the 2.5 models only to
      projects that used them before. A new project should take
      gemini-3.1-flash-lite instead.
sources:
  - url: https://ai.google.dev/gemini-api/docs/deprecations
    title: Gemini API deprecations
    accessed: 2026-10-16
last_verified: 2026-10-16
