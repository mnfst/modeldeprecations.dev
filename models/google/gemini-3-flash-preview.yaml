# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: google
model: gemini-3-flash-preview
name: Gemini 3 Flash (preview)
description: >-
  The first Flash model of the Gemini 3 generation. Google lists a recommended
  replacement for it but no shutdown date, which puts it in an unusual middle
  state: superseded but not yet scheduled.
released_on: 2025-12-17
status: active
replacements:
  - provider: google
    model: gemini-3.6-flash
    recommended: true
    note: >-
      Google names gemini-3.6-flash as the replacement even though no shutdown
      date has been set. Moving now avoids a rushed migration when one is.
sources:
  - url: https://ai.google.dev/gemini-api/docs/deprecations
    title: Gemini API deprecations
    accessed: 2026-07-30
last_verified: 2026-07-30
