# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: google
model: gemini-2.5-flash-lite
name: Gemini 2.5 Flash-Lite
description: >-
  The cheapest model of the 2.5 generation, built for classification and
  extraction at volume where the thinking budget could be set to zero. Not
  deprecated and with no shutdown date announced, but Google now serves the 2.5
  line only to users who actively used it before.
released_on: 2025-07-22
status: active
replacements:
  - provider: google
    model: gemini-3.5-flash-lite
    recommended: false
    note: >-
      Google names no replacement while 2.5 is served, and points new projects
      to 3.5 Flash-Lite, the cheapest tier of the current generation.
sources:
  - url: https://ai.google.dev/gemini-api/docs/deprecations
    title: Gemini API deprecations
    accessed: 2026-10-16
last_verified: 2026-10-16
