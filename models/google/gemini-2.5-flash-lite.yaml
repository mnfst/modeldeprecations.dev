# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: google
model: gemini-2.5-flash-lite
name: Gemini 2.5 Flash-Lite
description: >-
  The cheapest model of the 2.5 generation, built for classification and
  extraction at volume where the thinking budget could be set to zero. Like the
  rest of the 2.5 line it is not deprecated and has no shutdown date, but Google
  serves it only to projects that already used it.
released_on: 2025-07-22
status: active
restricted: >-
  Google: "we are limiting access to the 2.5 models to users who have actively
  used them in the past." Projects that already called it keep it; new
  projects are told to use 3.5 Flash-Lite or 3.8 Flash.
replacements:
  - provider: google
    model: gemini-3.1-flash-lite
    recommended: true
    note: >-
      Note that Google points Flash-Lite at the 3.1 generation while pointing
      Flash at 3.6 — the Lite tiers are on their own release cadence.
sources:
  - url: https://ai.google.dev/gemini-api/docs/deprecations
    title: Gemini API deprecations
    accessed: 2026-10-19
  - url: https://ai.google.dev/gemini-api/docs/models
    title: Gemini API models
    accessed: 2026-10-19
last_verified: 2026-10-19
