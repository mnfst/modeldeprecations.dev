# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: google
model: gemini-3.1-flash-lite
name: Gemini 3.1 Flash-Lite
description: >-
  The Flash-Lite of the 3.1 generation, and the model Google names as the
  replacement for the 2.0 and 2.5 Lite tiers. It is not deprecated, but Google
  has already published May 2027 as the earliest date it could be retired.
released_on: 2026-05-07
earliest_shutdown_on: 2027-05-07
status: active
replacements:
  - provider: google
    model: gemini-3.5-flash-lite
    recommended: true
    note: >-
      Named as the eventual successor. No action is needed yet — this model is
      current and fully supported.
sources:
  - url: https://ai.google.dev/gemini-api/docs/deprecations
    title: Gemini API deprecations
    accessed: 2026-07-30
last_verified: 2026-07-30
