# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: google
model: gemini-2.5-flash
name: Gemini 2.5 Flash
description: >-
  Probably the highest-volume Gemini model ever deployed: fast, cheap, and the
  first Flash with a configurable thinking budget. Not deprecated and no
  shutdown date announced; Google now limits the 2.5 models to users who
  actively used them before and serves them "until further notice".
released_on: 2025-06-17
status: active
replacements:
  - provider: google
    model: gemini-3.6-flash
    recommended: false
    note: >-
      Google names no replacement while 2.5 is served, and points new projects
      to 3.5 Flash-Lite or 3.8 Flash; 3.6 Flash is the nearest Flash with a page
      here. The thinking-budget
      configuration introduced in 2.5 Flash has changed shape since — re-read the
      thinking docs rather than porting the config.
sources:
  - url: https://ai.google.dev/gemini-api/docs/deprecations
    title: Gemini API deprecations
    accessed: 2026-10-16
last_verified: 2026-10-16
