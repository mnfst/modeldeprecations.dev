# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: google
model: gemini-1.0-pro
name: Gemini 1.0 Pro
aliases: [gemini-pro]
description: >-
  The first Gemini available through an API, launched in December 2023 under
  the bare id gemini-pro as Google's answer to GPT-4. Google never published a
  shutdown date for it: its release notes say only, on February 18, 2025, that
  Gemini 1.0 Pro is no longer supported, so this page carries a status but no
  shutdown day.
released_on: 2023-12-13
status: retired
replacements:
  - provider: google
    model: gemini-2.5-pro
    recommended: true
    note: >-
      Nothing about a 1.0-era integration survives unchanged: the SDK, the
      request shape and the safety-setting enums have all been replaced since.
sources:
  - url: https://ai.google.dev/gemini-api/docs/deprecations
    title: Gemini API deprecations
    accessed: 2026-10-16
  - url: https://ai.google.dev/gemini-api/docs/changelog
    title: Gemini API release notes
    accessed: 2026-10-16
last_verified: 2026-10-16
