# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: google
model: imagen-4.0-generate-001
name: Imagen 4
description: >-
  The last Imagen generation on the Gemini API and the named replacement for
  Imagen 3. Google ran two image lines side by side for a year, Imagen for
  dedicated text-to-image and the Gemini Flash Image models for conversational
  editing, then shut Imagen down on August 17, 2026 and folded image
  generation into the Nano Banana models.
released_on: 2025-06-24
shutdown_on: 2026-08-17
status: retired
replacements:
  - provider: google
    model: gemini-nano-banana-2.1
    recommended: true
    api_change: >-
      Nano Banana is called with generate_content (generateContent), not
      generate_images, and returns the image as a content part holding the image
      data instead of Imagen's generated-images response object.
sources:
  - url: https://ai.google.dev/gemini-api/docs/deprecations
    title: Gemini API deprecations
    accessed: 2026-10-19
  - url: https://ai.google.dev/gemini-api/docs/imagen
    title: Gemini API Imagen page (migration to Nano Banana)
    accessed: 2026-10-19
last_verified: 2026-10-19
