# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: google
model: gemini-1.5-flash-8b
name: Gemini 1.5 Flash-8B
aliases: [gemini-1.5-flash-8b-001]
description: >-
  The smallest Gemini the API served, which went stable as
  gemini-1.5-flash-8b-001 on October 3, 2024 ("our smallest Gemini API model",
  in Google's words). Google shut it down on September 29, 2025, alongside 1.5
  Pro and 1.5 Flash, without naming a successor.
released_on: 2024-10-03
shutdown_on: 2025-09-29
status: retired
replacements:
  - provider: google
    model: gemini-3.5-flash-lite
    recommended: false
    note: >-
      Our suggestion, not Google's: it named no successor for 1.5 Flash-8B, and
      it points new projects at 3.5 Flash-Lite as its cheapest current model.
sources:
  - url: https://ai.google.dev/gemini-api/docs/changelog
    title: Gemini API release notes
    accessed: 2026-10-16
  - url: https://ai.google.dev/gemini-api/docs/deprecations
    title: Gemini API deprecations
    accessed: 2026-10-16
last_verified: 2026-10-16
