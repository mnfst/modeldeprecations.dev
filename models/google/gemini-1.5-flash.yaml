# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: google
model: gemini-1.5-flash
name: Gemini 1.5 Flash
aliases: [gemini-1.5-flash-002, gemini-1.5-flash-latest]
description: >-
  The cheap, fast half of the 1.5 generation, and the model that pushed
  long-context pricing down across the whole market. Google has since removed
  the 1.5 rows from its deprecation table, but its release notes record the
  shutdown: on September 29, 2025, gemini-1.5-flash stopped answering along with
  1.5 Pro and 1.5 Flash-8B.
released_on: 2024-05-14
shutdown_on: 2025-09-29
status: retired
replacements:
  - provider: google
    model: gemini-2.5-flash
    recommended: true
    note: >-
      2.5 Flash is the direct successor, but Google now limits the 2.5 models to
      users who already used them: a project that never called it cannot move
      to it, and should take gemini-3.8-flash instead.
  - provider: google
    model: gemini-3.8-flash
    note: >-
      Not a successor Google names for this model, but one of the two it tells
      new projects to use (3.5 Flash-Lite or 3.8 Flash) while 2.5 is closed to
      them.
sources:
  - url: https://ai.google.dev/gemini-api/docs/deprecations
    title: Gemini API deprecations
    accessed: 2026-10-19
  - url: https://ai.google.dev/gemini-api/docs/changelog
    title: Gemini API release notes
    accessed: 2026-10-19
  - url: https://ai.google.dev/gemini-api/docs/models
    title: Gemini API models
    accessed: 2026-10-19
last_verified: 2026-10-19
