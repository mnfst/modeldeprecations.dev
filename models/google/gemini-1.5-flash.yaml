# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: google
model: gemini-1.5-flash
name: Gemini 1.5 Flash
aliases: [gemini-1.5-flash-002, gemini-1.5-flash-latest]
description: >-
  The cheap, fast half of the 1.5 generation, and the model that pushed
  long-context pricing down across the whole market. Google's release notes for
  September 29, 2025 record it as shut down, together with 1.5 Pro and 1.5
  Flash-8B; its rows have since left the deprecations table.
released_on: 2024-05-14
shutdown_on: 2025-09-29
status: retired
replacements:
  - provider: google
    model: gemini-2.5-flash
    recommended: true
    note: >-
      2.5 Flash is the direct successor and has no shutdown date, but Google now
      limits the 2.5 models to users who actively used them before. For new
      projects Google points to 3.5 Flash-Lite or 3.8 Flash.
sources:
  - url: https://ai.google.dev/gemini-api/docs/changelog
    title: Gemini API release notes
    accessed: 2026-10-16
last_verified: 2026-10-16
