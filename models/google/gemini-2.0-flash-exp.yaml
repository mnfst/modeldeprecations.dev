# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: google
model: gemini-2.0-flash-exp
name: Gemini 2.0 Flash Experimental
description: >-
  The experimental preview that introduced Gemini 2.0 in December 2024, with
  built-in tool use, the Live API and image and speech output ahead of the
  stable 2.0 Flash. Plenty of
  sample code and tutorials from that winter still name it. Google announced its
  shutdown on November 4, 2025 and turned it off on December 9, 2025.
released_on: 2024-12-11
deprecated_on: 2025-11-04
shutdown_on: 2025-12-09
status: retired
replacements:
  - provider: google
    model: gemini-3.6-flash
    recommended: false
    note: >-
      Our suggestion, not Google's: the shutdown notice names no successor.
      gemini-3.6-flash is what Google names for the stable gemini-2.0-flash.
sources:
  - url: https://ai.google.dev/gemini-api/docs/changelog
    title: Gemini API release notes
    accessed: 2026-10-16
last_verified: 2026-10-16
