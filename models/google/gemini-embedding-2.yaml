provider: google
model: gemini-embedding-2
name: Gemini Embedding 2
description: >-
  The current Gemini embedding model, and the named successor to both
  gemini-embedding-001 and the older text-embedding-004. It is the one id every
  retired Google embedding chain terminates on, which makes it the safest place
  to point a new retrieval stack.
