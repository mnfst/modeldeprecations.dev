# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: google
model: gemini-1.5-pro
name: Gemini 1.5 Pro
aliases: [gemini-1.5-pro-002, gemini-1.5-pro-latest]
description: >-
  The model that made a million-token context window a mainstream expectation,
  and for a year the reason teams chose Gemini at all. Google has removed it
  from its deprecations page, as it does once a model is long gone, but the
  Gemini API release notes record the shutdown on September 29, 2025, together
  with the rest of the 1.5 family.
released_on: 2024-02-15
shutdown_on: 2025-09-29
status: retired
replacements:
  - provider: google
    model: gemini-2.5-pro
    recommended: true
    note: >-
      Google now limits the 2.5 models to users who already used them, so a
      project that never called 2.5 Pro cannot move to it; take
      gemini-3.8-flash instead. 2.5 thinks before answering by default, so
      budget with thinkingConfig rather than 1.5-era numbers.
  - provider: google
    model: gemini-3.8-flash
    note: >-
      Not a successor Google names for this model, but one of the two it tells
      new projects to use (3.5 Flash-Lite or 3.8 Flash) while 2.5 is closed to
      them.
sources:
  - url: https://ai.google.dev/gemini-api/docs/deprecations
    title: Gemini API deprecations
    accessed: 2026-10-19
  - url: https://ai.google.dev/gemini-api/docs/changelog
    title: Gemini API release notes
    accessed: 2026-10-19
  - url: https://ai.google.dev/gemini-api/docs/models
    title: Gemini API models
    accessed: 2026-10-19
last_verified: 2026-10-19
