# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: google
model: gemini-1.5-pro
name: Gemini 1.5 Pro
aliases: [gemini-1.5-pro-002, gemini-1.5-pro-latest]
description: >-
  The model that made a million-token context window a mainstream expectation,
  and for a year the reason teams chose Gemini at all. Google has removed it
  from its deprecations page, as it does once a model is long gone, but the
  Gemini API release notes record the shutdown on September 29, 2025, together
  with the rest of the 1.5 family.
released_on: 2024-02-15
shutdown_on: 2025-09-29
status: retired
replacements:
  - provider: google
    model: gemini-2.5-pro
    recommended: true
    note: >-
      The 2.5 generation thinks before answering by default, which changes both
      latency and token cost. Budget with thinkingConfig rather than assuming
      1.5-era numbers carry over.
sources:
  - url: https://ai.google.dev/gemini-api/docs/deprecations
    title: Gemini API deprecations
    accessed: 2026-10-16
  - url: https://ai.google.dev/gemini-api/docs/changelog
    title: Gemini API release notes
    accessed: 2026-10-16
last_verified: 2026-10-16
