# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: google
model: gemini-2.5-pro
name: Gemini 2.5 Pro
description: >-
  The model that put Google back at the front of the field in mid-2025, with
  thinking enabled by default and a million-token context window. Google
  dropped its earliest shutdown date: the 2.5 models are not deprecated, are
  served "until further notice", and are now limited to users who actively
  used them before.
released_on: 2025-06-17
status: active
replacements:
  - provider: google
    model: gemini-3.1-pro-preview
    recommended: false
    note: >-
      Google names no replacement while 2.5 is served. This successor still
      carries a -preview suffix, so a migration off 2.5 Pro currently means
      moving onto a preview id. Factor that into the timing.
sources:
  - url: https://ai.google.dev/gemini-api/docs/deprecations
    title: Gemini API deprecations
    accessed: 2026-10-16
last_verified: 2026-10-16
