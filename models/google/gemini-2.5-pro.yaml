# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: google
model: gemini-2.5-pro
name: Gemini 2.5 Pro
description: >-
  The model that put Google back at the front of the field in mid-2025, with
  thinking enabled by default and a million-token context window. Google once
  listed October 16, 2026 as its earliest shutdown, then dropped the date: the
  deprecations page now says the 2.5 models are not deprecated and will be
  served until further notice, though only to projects that used them before.
released_on: 2025-06-17
status: active
replacements:
  - provider: google
    model: gemini-3.1-pro-preview
    recommended: true
    note: >-
      The successor still carries a -preview suffix, so a migration off 2.5 Pro
      currently means moving onto a preview id. Factor that into the timing.
sources:
  - url: https://ai.google.dev/gemini-api/docs/deprecations
    title: Gemini API deprecations
    accessed: 2026-10-16
last_verified: 2026-10-16
