# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: google
model: gemini-2.5-flash-image
name: Gemini 2.5 Flash Image
description: >-
  The original Nano Banana, and the model that made conversational image editing
  a mainstream feature in late 2025. Still active: Google's deprecations page
  gives March 15, 2027 as the earliest it could be retired, not the October 2,
  2026 recorded here before, and names 3.1 Flash-Lite Image as its replacement.
released_on: 2025-10-02
earliest_shutdown_on: 2027-03-15
status: active
replacements:
  - provider: google
    model: gemini-3.1-flash-lite-image
    recommended: true
sources:
  - url: https://ai.google.dev/gemini-api/docs/deprecations
    title: Gemini API deprecations
    accessed: 2026-10-16
last_verified: 2026-10-16
