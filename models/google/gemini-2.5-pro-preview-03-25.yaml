# yaml-language-server: $schema=https://modeldeprecations.dev/api/v1/schema.json
provider: google
model: gemini-2.5-pro-preview-03-25
name: Gemini 2.5 Pro (preview 03-25)
description: >-
  The first 2.5 Pro preview, from March 2025, and the release where Gemini
  started thinking before answering by default. It was widely benchmarked under
  this id, which is why it still appears in evaluation code. Shut down December
  2025.
released_on: 2025-03-25
shutdown_on: 2025-12-02
status: retired
replacements:
  - provider: google
    model: gemini-3.1-pro-preview
    recommended: true
    note: >-
      If you are reproducing a benchmark rather than shipping, note that no
      hosted model reproduces this snapshot's behaviour.
sources:
  - url: https://ai.google.dev/gemini-api/docs/deprecations
    title: Gemini API deprecations
    accessed: 2026-07-30
last_verified: 2026-07-30
