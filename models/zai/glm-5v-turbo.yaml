provider: zai
model: glm-5v-turbo
name: GLM-5V-Turbo
description: >-
  The vision model of the GLM-5 generation, and the only one - there is no base
  GLM-5V, just the turbo variant. Z.ai's V-series numbering tracks the text models
  one release behind, so the vision line is always a generation adrift of the
  flagship.
