name: Data guard

# Blocks pull requests that break the two promises this site makes: that a URL
# keeps answering, and that a date stays true.
#
# Specifically it rejects removing a model page, removing an alias that used to
# resolve, stripping the sources out from under a date, and editing a lifecycle
# date without moving last_verified forward.
#
# Override: a maintainer applies the `allow-data-regression` label to the PR. The
# label change re-triggers this workflow (see `types` below) and the guard step
# is skipped, leaving an auditable warning in the checks output.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  no-data-regressions:
    name: No data regressions
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch --no-tags origin "${{ github.base_ref }}"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Guard against data regressions
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'allow-data-regression') }}
        run: npm run guard:data
        env:
          BASE_REF: "origin/${{ github.base_ref }}"

      - name: Regression override acknowledged
        if: ${{ contains(github.event.pull_request.labels.*.name, 'allow-data-regression') }}
        run: |
          echo "::warning::'allow-data-regression' label present — data-regression guard intentionally skipped for this PR."
