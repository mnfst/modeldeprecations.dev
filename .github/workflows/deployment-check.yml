name: Deployment check

# Crawl checks against the deployed origin. Kept out of ci.yml on purpose: these
# assert things the repo cannot get wrong on its own — routing, redirects and
# response headers applied at the edge — so failing a pull request on them would
# block work on a problem the pull request did not cause.

on:
  schedule:
    # Daily, a little after the usual deploy window.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      origin:
        description: "Origin to check"
        required: false
        default: "https://modeldeprecations.dev"

jobs:
  check:
    name: Crawl the deployed site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check deployment
        run: node scripts/check-deployment.mjs "${{ inputs.origin || 'https://modeldeprecations.dev' }}"
